name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Vet, and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -coverprofile=coverage.txt ./...

      - name: Build API
        run: go build -v -o api ./cmd/api

      - name: Build Mock Backend (Integration Testing Utility)
        run: go build -v -o mock_backend ./cmd/mock_backend

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.txt
